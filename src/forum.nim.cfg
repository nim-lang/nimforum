# jester 0.4.x does not expose httpbeast's numThreads setting, so with Nim 2.x
# (threads:on by default) the backend runs one request thread per core, all
# sharing one sqlite connection and GC'd globals under the non-thread-safe refc
# GC -> glibc heap corruption aborts and periodic 502s. Restore the Nim 1.x
# single-threaded behaviour.
--threads:off
